<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phê Duyệt Yêu Cầu - Trang Quản Trị</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <div class="min-h-screen flex flex-col">
        <!-- Navigation -->
        <nav class="bg-blue-900 border-b border-blue-800">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-lg font-bold text-slate-800">Trang Quản Trị</h1>
                <div class="flex items-center space-x-8">
                    <a href="dashboard.html" class="text-slate-600 hover:text-slate-900 font-medium text-sm transition">Dashboard</a>
                    <a href="approve.html" class="text-white font-medium text-sm border-b-2 border-blue-400 pb-1">Phê Duyệt</a>
                    <button onclick="logout()" class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700 font-medium text-sm transition">Đăng Xuất</button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-6 py-12 flex-grow">
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-slate-900">Phê Duyệt Yêu Cầu</h2>
                <p class="text-slate-600 mt-1">Xem xét và phê duyệt các yêu cầu từ nhà trường</p>
            </div>

            <!-- Wallet Info -->
            <div id="walletInfo" class="mb-8 p-4 bg-blue-50 border-l-4 border-blue-500 rounded">
                <p class="text-sm text-blue-800">
                    <strong>Ví Admin:</strong> <span id="walletAddress" class="font-mono text-blue-900"></span>
                </p>
            </div>

            <!-- Tabs -->
            <div class="flex gap-4 mb-6 border-b border-slate-200">
                <button onclick="switchTab('students')" id="tab-students" class="px-6 py-3 font-semibold text-slate-600 border-b-2 border-slate-200 hover:text-slate-900 transition active-tab">
                    Sinh Viên (<span id="count-students">0</span>)
                </button>
                <button onclick="switchTab('grades')" id="tab-grades" class="px-6 py-3 font-semibold text-slate-600 border-b-2 border-slate-200 hover:text-slate-900 transition">
                    Điểm Số (<span id="count-grades">0</span>)
                </button>
                <button onclick="switchTab('degrees')" id="tab-degrees" class="px-6 py-3 font-semibold text-slate-600 border-b-2 border-slate-200 hover:text-slate-900 transition">
                    Bằng Cấp (<span id="count-degrees">0</span>)
                </button>
            </div>

            <!-- Success/Error Messages -->
            <div id="successMsg" class="hidden mb-4 p-4 bg-emerald-50 border border-emerald-300 rounded-lg">
                <p class="text-emerald-800" id="successText"></p>
            </div>
            <div id="errorMsg" class="hidden mb-4 p-4 bg-red-50 border border-red-300 rounded-lg">
                <p class="text-red-800" id="errorText"></p>
            </div>

            <!-- Students Tab -->
            <div id="tab-content-students" class="space-y-4">
                <div id="students-list">
                    <p class="text-slate-500 p-4">Không có yêu cầu nào</p>
                </div>
            </div>

            <!-- Grades Tab -->
            <div id="tab-content-grades" class="hidden space-y-4">
                <div id="grades-list">
                    <p class="text-slate-500 p-4">Không có yêu cầu nào</p>
                </div>
            </div>

            <!-- Degrees Tab -->
            <div id="tab-content-degrees" class="hidden space-y-4">
                <div id="degrees-list">
                    <p class="text-slate-500 p-4">Không có yêu cầu nào</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 mt-12">
            <div class="max-w-7xl mx-auto px-6 text-center text-sm">
                <p>&copy; 2026 Blockchain Student Management System - Admin Panel</p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/web3@1.8.0/dist/web3.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/web3.js"></script>
    <script src="../js/contract.js"></script>
    <script>
        let currentTab = 'students';

        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in as admin
            const session = JSON.parse(localStorage.getItem('user_session') || 'null');
            
            if (!session || session.role !== 'admin') {
                alert(' Bạn không được phép truy cập trang này!');
                window.location.href = '../login-admin.html';
                return;
            }

            // Display wallet
            const shortWallet = session.walletAddress.substring(0, 6) + '...' + session.walletAddress.substring(session.walletAddress.length - 4);
            document.getElementById('walletAddress').textContent = shortWallet;

            // Initialize Web3
            initWeb3();
            
            // Load requests
            loadRequests();
        });

        function switchTab(tab) {
            currentTab = tab;

            // Update tab buttons
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('text-slate-900', 'border-blue-400');
                btn.classList.add('text-slate-600', 'border-slate-200');
            });
            document.getElementById('tab-' + tab).classList.remove('text-slate-600', 'border-slate-200');
            document.getElementById('tab-' + tab).classList.add('text-slate-900', 'border-blue-400');

            // Update content
            document.querySelectorAll('[id^="tab-content-"]').forEach(div => {
                div.classList.add('hidden');
            });
            document.getElementById('tab-content-' + tab).classList.remove('hidden');
        }

        function loadRequests() {
            const pendingRequests = JSON.parse(localStorage.getItem('pending_requests') || '{"students":[],"grades":[],"degrees":[]}');

            // Update counts
            document.getElementById('count-students').textContent = pendingRequests.students.filter(r => r.status === 'pending').length;
            document.getElementById('count-grades').textContent = pendingRequests.grades.filter(r => r.status === 'pending').length;
            document.getElementById('count-degrees').textContent = pendingRequests.degrees.filter(r => r.status === 'pending').length;

            // Render students
            renderStudents(pendingRequests.students);

            // Render grades
            renderGrades(pendingRequests.grades);

            // Render degrees
            renderDegrees(pendingRequests.degrees);
        }

        function renderStudents(students) {
            const container = document.getElementById('students-list');
            const pending = students.filter(s => s.status === 'pending');

            if (pending.length === 0) {
                container.innerHTML = '<div class="text-slate-500 p-4 text-center"> Không có yêu cầu chờ duyệt</div>';
                return;
            }

            container.innerHTML = pending.map(req => `
                <div class="bg-white p-6 rounded-lg border border-slate-300 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="font-bold text-lg text-slate-900">${req.data.fullName}</p>
                            <p class="text-sm text-slate-600">MSSV: ${req.data.studentId}</p>
                        </div>
                        <span class="text-xs bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full">⏳ Chờ Duyệt</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-4 text-sm text-slate-700">
                        <div>
                            <p class="text-gray-500">Ngày Sinh</p>
                            <p class="font-medium">${req.data.dateOfBirth}</p>
                        </div>
                        <div>
                            <p class="text-gray-500">Ngành Học</p>
                            <p class="font-medium">${req.data.course}</p>
                        </div>
                        <div>
                            <p class="text-gray-500">Năm Nhập Học</p>
                            <p class="font-medium">${req.data.enrollmentYear}</p>
                        </div>
                        <div>
                            <p class="text-gray-500">Ví</p>
                            <p class="font-mono text-xs">${req.data.walletAddress.substring(0, 10)}...</p>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mb-4">Gửi từ: ngày ${new Date(req.createdAt).toLocaleString('vi-VN')}</p>
                    <div class="flex gap-2">
                        <button onclick="approveRequest('${req.id}', 'student')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-semibold text-sm transition">
                             Phê Duyệt & Ghi Blockchain
                        </button>
                        <button onclick="rejectRequest('${req.id}', 'student')" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded font-semibold text-sm transition">
                             Từ Chối
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderGrades(grades) {
            const container = document.getElementById('grades-list');
            const pending = grades.filter(g => g.status === 'pending');

            if (pending.length === 0) {
                container.innerHTML = '<div class="text-slate-500 p-4 text-center"> Không có yêu cầu chờ duyệt</div>';
                return;
            }

            container.innerHTML = pending.map(req => `
                <div class="bg-white p-6 rounded-lg border border-slate-300 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="font-bold text-lg text-slate-900">${req.data.subjectName}</p>
                            <p class="text-sm text-slate-600">MSSV: ${req.data.studentId}</p>
                        </div>
                        <span class="text-xs bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full">⏳ Chờ Duyệt</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-4 text-sm text-slate-700">
                        <div>
                            <p class="text-gray-500">Học Kỳ</p>
                            <p class="font-medium">${req.data.semester}</p>
                        </div>
                        <div>
                            <p class="text-gray-500">Điểm</p>
                            <p class="font-bold text-lg text-emerald-600">${req.data.score}/100</p>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mb-4">Gửi từ: ngày ${new Date(req.createdAt).toLocaleString('vi-VN')}</p>
                    <div class="flex gap-2">
                        <button onclick="approveRequest('${req.id}', 'grade')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-semibold text-sm transition">
                             Phê Duyệt & Ghi Blockchain
                        </button>
                        <button onclick="rejectRequest('${req.id}', 'grade')" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded font-semibold text-sm transition">
                             Từ Chối
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function renderDegrees(degrees) {
            const container = document.getElementById('degrees-list');
            const pending = degrees.filter(d => d.status === 'pending');

            if (pending.length === 0) {
                container.innerHTML = '<div class="text-slate-500 p-4 text-center"> Không có yêu cầu chờ duyệt</div>';
                return;
            }

            container.innerHTML = pending.map(req => `
                <div class="bg-white p-6 rounded-lg border border-slate-300 shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="font-bold text-lg text-slate-900">${req.data.degreeType}</p>
                            <p class="text-sm text-slate-600">MSSV: ${req.data.studentId}</p>
                        </div>
                        <span class="text-xs bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full">⏳ Chờ Duyệt</span>
                    </div>
                    <div class="mb-4 text-sm text-slate-700">
                        <p class="text-gray-500">Cơ sở Cấp</p>
                        <p class="font-medium">${req.data.organization}</p>
                    </div>
                    <p class="text-xs text-gray-500 mb-4">Gửi từ: ngày ${new Date(req.createdAt).toLocaleString('vi-VN')}</p>
                    <div class="flex gap-2">
                        <button onclick="approveRequest('${req.id}', 'degree')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded font-semibold text-sm transition">
                             Phê Duyệt & Ghi Blockchain
                        </button>
                        <button onclick="rejectRequest('${req.id}', 'degree')" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded font-semibold text-sm transition">
                             Từ Chối
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function approveRequest(requestId, type) {
            if (!confirm('Bạn chắc chắn muốn phê duyệt và ghi blockchain?')) {
                return;
            }

            try {
                const pendingRequests = JSON.parse(localStorage.getItem('pending_requests'));
                let request = null;
                let typeArray = pendingRequests[type + 's'];

                // Find request
                request = typeArray.find(r => r.id === requestId);
                if (!request) {
                    showError(' Không tìm thấy yêu cầu');
                    return;
                }

                // Get contract
                const contract = getContract();
                const accounts = await window.ethereum.request({method: 'eth_requestAccounts'});
                const account = accounts[0];

                // Write to blockchain based on type
                if (type === 'student') {
                    const data = request.data;
                    await contract.methods.createStudent(
                        data.studentId,
                        data.fullName,
                        data.dateOfBirth,
                        data.course,
                        data.enrollmentYear,
                        data.walletAddress
                    ).send({from: account});
                } else if (type === 'grade') {
                    const data = request.data;
                    await contract.methods.addGrade(
                        data.studentId,
                        data.subjectName,
                        data.semester,
                        data.score
                    ).send({from: account});
                } else if (type === 'degree') {
                    const data = request.data;
                    
                    // Convert studentId to number (important!)
                    const studentId = parseInt(data.studentId);
                    const degreeType = data.degreeType || '';
                    const organization = data.organization || '';
                    
                    // DEBUG: Log all data fields
                    console.log('DEBUG - Request data:', data);
                    console.log('DEBUG - studentId:', studentId, 'type:', typeof studentId);
                    console.log('DEBUG - degreeType:', degreeType, 'type:', typeof degreeType);
                    console.log('DEBUG - organization:', organization, 'type:', typeof organization);
                    
                    // Generate random 8-digit degree ID and hash it
                    const randomDegreeId = Math.floor(10000000 + Math.random() * 90000000).toString();
                    const degreeHash = web3.utils.soliditySha3(randomDegreeId);
                    
                    console.log('Random Degree ID:', randomDegreeId);
                    console.log('Degree Hash:', degreeHash);
                    
                    // Save the mapping for student to view later
                    const degreeMapping = JSON.parse(localStorage.getItem('degree_id_mapping') || '{}');
                    degreeMapping[randomDegreeId] = {
                        hash: degreeHash,
                        studentId: studentId,
                        degreeType: degreeType,
                        organization: organization,
                        createdAt: new Date().toISOString()
                    };
                    localStorage.setItem('degree_id_mapping', JSON.stringify(degreeMapping));
                    
                    // DEBUG: Log parameters before calling issueDegree
                    console.log('DEBUG - Calling issueDegree with params:');
                    console.log('  param1 (studentId):', studentId);
                    console.log('  param2 (degreeType):', degreeType);
                    console.log('  param3 (organization):', organization);
                    console.log('  param4 (degreeHash):', degreeHash);
                    
                    await contract.methods.issueDegree(
                        studentId,
                        degreeType,
                        organization,
                        degreeHash
                    ).send({from: account}).catch(err => {
                        console.error('ERROR calling issueDegree:', err);
                        console.error('Error message:', err.message);
                        throw err;
                    });
                    
                    // Show degree ID to admin
                    showSuccess(` Yêu cầu đã được phê duyệt! Mã ID bằng cấp: ${randomDegreeId}`);
                }

                // Update request status
                const index = typeArray.findIndex(r => r.id === requestId);
                typeArray[index].status = 'approved';
                typeArray[index].approvedAt = new Date().toISOString();
                typeArray[index].approvedBy = account;

                localStorage.setItem('pending_requests', JSON.stringify(pendingRequests));

                if (type !== 'degree') {
                    showSuccess(' Yêu cầu đã được phê duyệt và ghi blockchain thành công!');
                }
                setTimeout(() => loadRequests(), 2000);

            } catch (error) {
                console.error('Error:', error);
                showError(' Lỗi: ' + error.message);
            }
        }

        function rejectRequest(requestId, type) {
            if (!confirm('Bạn chắc chắn muốn từ chối yêu cầu này?')) {
                return;
            }

            const pendingRequests = JSON.parse(localStorage.getItem('pending_requests'));
            const typeArray = pendingRequests[type + 's'];
            const index = typeArray.findIndex(r => r.id === requestId);

            typeArray[index].status = 'rejected';
            typeArray[index].rejectedAt = new Date().toISOString();

            localStorage.setItem('pending_requests', JSON.stringify(pendingRequests));
            showSuccess(' Yêu cầu đã bị từ chối!');
            setTimeout(() => loadRequests(), 1500);
        }

        function showSuccess(message) {
            document.getElementById('successText').textContent = message;
            document.getElementById('successMsg').classList.remove('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('successMsg').classList.add('hidden');
            }, 5000);
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMsg').classList.remove('hidden');
            document.getElementById('successMsg').classList.add('hidden');
        }

        function logout() {
            if (confirm('Bạn chắc chắn muốn đăng xuất?')) {
                localStorage.removeItem('user_session');
                window.location.href = '../login-admin.html';
            }
        }
    </script>
</body>
</html>
